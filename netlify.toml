# Netlify deployment config.
# Works with private repos on the free plan and gives an automatic HTTPS URL,
# which is what the iPad PWA needs to install and run offline.
[build]
  command = "npm run build"
  publish = "dist"

# Single-page app: serve index.html for any unknown path.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
